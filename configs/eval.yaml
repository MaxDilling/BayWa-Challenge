# Harness configuration (SPEC.md, "Harness"). Run: make harness, or
#   uv run python -m harness --config configs/eval.yaml --models all [--datasets demo,dwd] [--holdout]

# Always runs; score = weighted mean of jury metric / baseline metric, so the baseline scores 1, lower is better.
baseline: identity

# Jury metrics and their weights in the score (normalized by the total weight). The energy deviation enters as
# energy_wape_pct, because the mean of |energy_dev_pct| is dominated by calm scenarios with a tiny true energy.
score:
  wind_rmse: 1
  wind_mae: 1
  power_rmse: 1
  power_mae: 1
  energy_wape_pct: 1

scenarios:
  lengths_h: [1, 6, 12, 24, 48, 72, 120]
  t0_step_h: 12
  min_train_days: 5
  holdout_days: 5  # locked: only runs with --holdout

# kind synthetic: harness/synthetic.py; kind folder: path glob relative to the repo, layout in harness/datasets.py.
# A folder pattern without CSVs is reported and skipped (data/challenge/ stays empty until the data arrives).
# wind_scale multiplies target and references alike: DWD measures at 10 m, where inland wind mostly stays below the
# 3 m/s cut-in; the power law (100 m / 10 m)^0.14 ≈ 1.38 lifts it towards hub height so the pairs exercise the
# steep part of the power curve. It is a proxy for testing, not a shear model of the sites.
datasets:
  - {name: synthetic, kind: synthetic, days: 30, seed: 0}
  - {name: demo, kind: folder, path: data/synthetic}
  - {name: dwd, kind: folder, path: "data/dwd/*", wind_scale: 1.38, scenarios: {t0_step_h: 24}}
  - {name: challenge, kind: folder, path: data/challenge, n_turbines: 1}
  # The organizers' data after `make csv`: each target turbine with the references outside its park (H, O). 90 days
  # and seven references per target: a wider t₀ step keeps the whole run under 30 s.
  - {name: T1, kind: folder, path: data/data_hackathon_baywa_re, files: [T1_*.csv, "[HO]*.csv"], target: T1_data,
     scenarios: {t0_step_h: 144}}
  - {name: T2, kind: folder, path: data/data_hackathon_baywa_re, files: [T2_*.csv, "[HO]*.csv"], target: T2_data,
     scenarios: {t0_step_h: 144}}
  - {name: T3, kind: folder, path: data/data_hackathon_baywa_re, files: [T3_*.csv, "[HO]*.csv"], target: T3_data,
     scenarios: {t0_step_h: 144}}
  # The same targets with the eight DWD stations of data/dwd_refs/ as extra references (make dwd-refs). on_demand: only
  # when named in --datasets, so `make harness` stays under 30 s.
  - {name: T1+dwd, kind: folder, path: data/data_hackathon_baywa_re, files: [T1_*.csv, "[HO]*.csv"], target: T1_data,
     extra_refs: [data/dwd_refs/*.csv], on_demand: true,
     scenarios: {t0_step_h: 144}}
  - {name: T2+dwd, kind: folder, path: data/data_hackathon_baywa_re, files: [T2_*.csv, "[HO]*.csv"], target: T2_data,
     extra_refs: [data/dwd_refs/*.csv], on_demand: true,
     scenarios: {t0_step_h: 144}}
  - {name: T3+dwd, kind: folder, path: data/data_hackathon_baywa_re, files: [T3_*.csv, "[HO]*.csv"], target: T3_data,
     extra_refs: [data/dwd_refs/*.csv], on_demand: true,
     scenarios: {t0_step_h: 144}}

# Extra leaderboard rows: a registered model with fixed params. Without the delay τ (M1 instead of M3), to show
# what the lag search adds.
variants:
  linear_regression_nolag: {model: linear_regression, params: {lag_max_min: 0}}
  # Without the factor per wind direction sector, to show what it adds where references carry a direction; on_demand:
  # only when named in --models (it adds a sixth of the run time).
  multi_regression_nowake: {model: multi_regression, params: {direction_sectors: 0}, on_demand: true}
